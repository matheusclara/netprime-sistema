services:
  netprime:
    build: .
    container_name: netprime_sistema
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      TZ: America/Sao_Paulo
      NETPRIME_MASTER_PASSWORD: ${NETPRIME_MASTER_PASSWORD:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
